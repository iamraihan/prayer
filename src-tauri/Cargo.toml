[package]
name = "prayer-times"
version = "0.2.0"
description = "Prayer times with tray status, alarms and reminders"
authors = ["ORANGEBD"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix is necessary for the lib name to be unique on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "prayer_times_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
rodio = { version = "0.20", features = ["wav", "mp3", "vorbis", "flac"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
